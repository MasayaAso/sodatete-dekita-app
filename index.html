<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>そだててできた</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --accent: #FF8A3D;
    --bg: #FFF8EC; --card: #FFFFFF; --ink: #3B2F2F; --sub: #8A7A6E; --line: #F0E2CC;
    --soft: #FFEBD9; --good: #2FA866; --good-soft: #DCF5E6; --star: #FFC531; --pink: #FF7EA8; --sky: #4FB0F0;
    --radius: 22px;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; }
  body {
    background: var(--bg);
    background-image: radial-gradient(circle at 10% 0%, #FFE9C7 0, transparent 40%), radial-gradient(circle at 100% 30%, #FFE1EC 0, transparent 35%);
    color: var(--ink);
    font-family: 'Zen Maru Gothic', 'Hiragino Maru Gothic ProN', 'Yu Gothic', sans-serif;
    font-weight: 700;
    min-height: 100vh;
    padding-top: 44px;
    padding-bottom: 110px;
  }
  button { font: inherit; color: inherit; cursor: pointer; border: 0; background: none; }
  .wrap { max-width: 760px; margin: 0 auto; padding: 16px; }

  /* ---------- ヘッダー：キャラクター ---------- */
  .hero {
    background: var(--card); border-radius: var(--radius); padding: 16px 18px;
    display: grid; grid-template-columns: auto 1fr; gap: 16px; align-items: center;
    box-shadow: 0 6px 0 var(--line);
  }
  .pet {
    width: 108px; height: 108px; border-radius: 50%; display: grid; place-items: center;
    font-size: 70px; background: var(--soft); position: relative; user-select: none;
    animation: float 3s ease-in-out infinite;
  }
  .pet.jump { animation: jump .7s ease; }
  .badge { position: absolute; top: -10px; right: -8px; font-size: .5em; transform: rotate(14deg); }
  .acc { position: absolute; top: -12px; left: -6px; font-size: .5em; transform: rotate(-16deg); }
  .pet.eat { animation: eat .9s ease; }
  @keyframes eat { 15%, 45%, 75% { transform: scale(1.12, .9); } 30%, 60%, 90% { transform: scale(.95, 1.06); } }
  .petbar { grid-column: 1 / -1; display: flex; align-items: center; justify-content: space-between; gap: 8px; padding-top: 10px; border-top: 2px dashed var(--line); }
  .pbtn { background: var(--soft); border-radius: 14px; padding: 6px 12px; font-size: 18px; font-weight: 900; box-shadow: 0 3px 0 var(--line); display: inline-flex; align-items: center; gap: 4px; white-space: nowrap; flex-shrink: 0; }
  .pbtn small { font-size: 12px; color: var(--sub); }
  .pbtn:active { transform: translateY(2px); box-shadow: none; }
  .pbtn.bone { background: #FFF1B8; }
  .tummy { font-size: 13px; letter-spacing: -3px; white-space: nowrap; text-align: center; flex: 1; }
  .flybone { position: fixed; font-size: 34px; z-index: 66; pointer-events: none; transition: left .55s cubic-bezier(.3,.6,.4,1), top .55s cubic-bezier(.5,-0.6,.6,1), transform .55s; }
  .heart { position: fixed; font-size: 24px; pointer-events: none; z-index: 65; animation: heartUp 1.2s ease-out forwards; }
  @keyframes heartUp { to { transform: translate(var(--x), -90px) scale(1.4); opacity: 0; } }
  /* たからばこ */
  .box-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 12px 0; }
  .box-item { background: #FBF5EA; border-radius: 16px; padding: 8px 4px; font-size: 12px; min-height: 84px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; }
  .box-item b { font-size: 34px; line-height: 1.1; }
  .box-item.on { outline: 4px solid var(--accent); background: #fff; }
  .box-item.lock { color: #B9A88F; }
  .box-item.lock b { filter: grayscale(1) brightness(1.6); opacity: .5; }
  .box-pet { font-size: 90px; position: relative; display: inline-block; margin-top: 6px; }
  /* さんぽ */
  .walk { position: fixed; inset: 0; z-index: 55; background: linear-gradient(#BFE6FF 0, #E8F7FF 62%, #A8DB8A 62%, #8CCB6E 100%); overflow: hidden; }
  .walk .sun { position: absolute; top: 40px; right: 40px; font-size: 64px; }
  .walk .cloud { position: absolute; font-size: 54px; animation: drift 14s linear infinite; }
  @keyframes drift { from { transform: translateX(-30vw); } to { transform: translateX(110vw); } }
  .walk .spot { position: absolute; left: 6vw; bottom: 30%; font-size: 120px; line-height: 1; }
  .walk .dog { position: absolute; bottom: 31%; font-size: 84px; right: -120px; animation: walkIn 4.2s ease-out forwards; }
  .walk .dog .in { display: inline-block; position: relative; animation: bob .35s ease-in-out infinite; }
  @keyframes walkIn { to { right: 52vw; } }
  @keyframes bob { 50% { transform: translateY(-10px) rotate(-4deg); } }
  .walk .msg { position: absolute; left: 50%; top: 22%; transform: translateX(-50%); background: #fff; border-radius: 24px; padding: 14px 22px; font-size: 22px; font-weight: 900; text-align: center; box-shadow: 0 8px 24px rgba(0,0,0,.12); opacity: 0; transition: opacity .4s; width: max-content; max-width: 90vw; }
  .walk .msg.show { opacity: 1; }
  .walk .msg button { display: block; margin: 12px auto 0; background: var(--accent); color: #fff; border-radius: 16px; padding: 10px 26px; font-size: 18px; }
  .walk-btn { display: block; margin: 14px auto 0; background: var(--accent); color: #fff; border-radius: 18px; padding: 12px 22px; font-size: 19px; font-weight: 900; box-shadow: 0 5px 0 rgba(0,0,0,.15); }
  .big-pet { position: relative; display: inline-block; }
  @keyframes float { 50% { transform: translateY(-6px); } }
  @keyframes jump { 30% { transform: translateY(-28px) scale(1.15) rotate(-8deg); } 60% { transform: translateY(0) scale(.95); } }
  .hero h1 { margin: 0; font-size: 15px; color: var(--sub); font-weight: 700; }
  .hero .name { font-size: 24px; font-weight: 900; margin: 2px 0 8px; }
  .bar { height: 18px; background: #F3EBDD; border-radius: 99px; overflow: hidden; }
  .bar > i { display: block; height: 100%; background: linear-gradient(90deg, var(--star), var(--accent)); border-radius: 99px; transition: width .6s cubic-bezier(.3,1.5,.6,1); }
  .hero .meta { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 8px; font-size: 15px; color: var(--sub); }
  .chip { background: var(--soft); color: var(--ink); padding: 4px 10px; border-radius: 99px; }

  /* ---------- 見出し ---------- */
  .day-head { display: flex; align-items: center; justify-content: space-between; margin: 22px 4px 12px; gap: 8px; }
  .day-head h2 { margin: 0; font-size: 22px; font-weight: 900; }
  .pill-btn { background: var(--card); padding: 8px 14px; border-radius: 99px; box-shadow: 0 3px 0 var(--line); font-size: 15px; }
  .notice { background: #FFF1B8; border-radius: 16px; padding: 10px 14px; margin-bottom: 12px; font-size: 16px; }

  /* ---------- しゅくだいカード ---------- */
  .tasks { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 14px; }
  .task {
    position: relative; background: var(--card); border-radius: var(--radius);
    padding: 18px 12px 16px; text-align: center; min-height: 170px;
    box-shadow: 0 7px 0 var(--line); transition: transform .12s, box-shadow .12s;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px;
  }
  .task:active { transform: translateY(5px); box-shadow: 0 2px 0 var(--line); }
  .task .ic { font-size: 52px; line-height: 1; }
  .task .lb { font-size: 19px; font-weight: 900; }
  .task .hint { font-size: 13px; color: var(--sub); font-weight: 500; }
  .task .st { font-size: 15px; color: #C98A00; }
  .tag { display: inline-block; color: #fff; background: var(--accent); border-radius: 99px; padding: 2px 10px; font-size: 13px; font-weight: 900; white-space: nowrap; }
  .task .tag { position: absolute; top: 10px; left: 10px; }

  .task.done { background: var(--good-soft); box-shadow: 0 7px 0 #B8E6CB; }
  .task.done .ic { filter: saturate(.6); opacity: .55; }
  .task .stamp {
    position: absolute; top: 8px; right: 8px; pointer-events: none;
    font-size: 17px; font-weight: 900; color: var(--good);
  }
  .task .stamp span {
    border: 4px solid var(--good); border-radius: 50%; width: 72px; height: 72px;
    display: grid; place-items: center; transform: rotate(-14deg); background: rgba(255,255,255,.75);
  }
  .task.just .stamp span { animation: stampIn .45s cubic-bezier(.2,1.6,.5,1); }
  @keyframes stampIn { 0% { transform: scale(2.4) rotate(-30deg); opacity: 0; } 100% { transform: scale(1) rotate(-14deg); opacity: 1; } }
  .rest { background: var(--card); border-radius: var(--radius); padding: 28px; text-align: center; font-size: 20px; box-shadow: 0 7px 0 var(--line); }

  /* ---------- ぜんぶできた ---------- */
  .alldone {
    margin-top: 18px; border-radius: var(--radius); padding: 18px; text-align: center;
    background: linear-gradient(135deg, #FFF3B0, #FFD6E7); box-shadow: 0 7px 0 #F5C9A8;
  }
  .alldone .big { font-size: 22px; font-weight: 900; margin-bottom: 10px; }
  .moods { display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; }
  .mood { background: #fff; border-radius: 18px; padding: 8px 10px; min-width: 84px; box-shadow: 0 4px 0 rgba(0,0,0,.08); font-size: 13px; }
  .mood b { display: block; font-size: 40px; line-height: 1.1; }
  .mood.on { outline: 4px solid var(--accent); }

  /* ---------- しゅうかん ---------- */
  .card { background: var(--card); border-radius: var(--radius); padding: 18px; box-shadow: 0 7px 0 var(--line); margin-bottom: 18px; }
  .card h3 { margin: 0 0 10px; font-size: 19px; font-weight: 900; }
  .goal-row { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 8px; font-size: 17px; }
  .goal-row .num { font-size: 28px; font-weight: 900; color: var(--accent); }
  .reward { margin-top: 10px; font-size: 16px; padding: 10px 12px; background: var(--soft); border-radius: 14px; }
  .reward.got { background: #FFF1B8; animation: wiggle 1.2s ease-in-out infinite; }
  .days { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
  .day { border-radius: 16px; padding: 8px 2px; text-align: center; background: #FBF5EA; min-height: 96px; display: flex; flex-direction: column; align-items: center; gap: 4px; }
  .day .dw { font-size: 14px; color: var(--sub); }
  .day .dn { font-size: 13px; color: var(--sub); font-weight: 500; }
  .day .sp { font-size: 30px; line-height: 1.2; min-height: 36px; display: grid; place-items: center; }
  .day .pt { font-size: 14px; color: var(--accent); font-weight: 900; }
  .day.today { outline: 3px solid var(--accent); background: #fff; }
  .day.future { opacity: .45; }
  .day.sel { background: var(--soft); }
  .empty-dot { width: 26px; height: 26px; border-radius: 50%; border: 3px dashed #E2D3BD; }
  /* ---------- こんげつの ひょう ---------- */
  .mnav { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
  .mnav h3 { margin: 0; }
  .mnav button { font-size: 22px; width: 44px; height: 44px; border-radius: 50%; background: var(--soft); }
  .mnav button:disabled { opacity: .3; }
  table.mtab { width: 100%; border-collapse: separate; border-spacing: 0 3px; font-size: 15px; table-layout: fixed; }
  table.mtab th { font-size: 11px; font-weight: 900; color: var(--sub); padding: 2px 0 6px; vertical-align: bottom; }
  table.mtab th .hi { display: block; font-size: 24px; line-height: 1.2; }
  table.mtab th .htag { display: block; font-size: 10px; line-height: 1.2; letter-spacing: -.5px; word-break: break-all; }
  table.mtab th.dcol { width: 64px; text-align: left; }
  table.mtab td { text-align: center; padding: 5px 0; background: #FBF5EA; height: 38px; }
  table.mtab td:first-child { border-radius: 12px 0 0 12px; text-align: left; padding-left: 8px; white-space: nowrap; }
  table.mtab td:last-child { border-radius: 0 12px 12px 0; }
  table.mtab tr.d { cursor: pointer; }
  table.mtab tr.sun td, table.mtab tr.sat td { background: #F6EEE0; }
  table.mtab tr.today td { background: #fff; box-shadow: inset 0 3px 0 var(--accent), inset 0 -3px 0 var(--accent); }
  table.mtab tr.today td:first-child { box-shadow: inset 3px 3px 0 var(--accent), inset 0 -3px 0 var(--accent); }
  table.mtab tr.today td:last-child { box-shadow: inset -3px 3px 0 var(--accent), inset 0 -3px 0 var(--accent); }
  table.mtab tr.full td { background: var(--good-soft); }
  table.mtab tr.future td { opacity: .45; }
  table.mtab tr.wk td { background: none; height: auto; padding: 0 8px 8px; text-align: right; font-size: 13px; color: var(--sub); border-bottom: 2px dashed var(--line); border-radius: 0; }
  table.mtab tr.tot td { background: var(--soft); font-weight: 900; font-size: 13px; }
  table.mtab .dsub { font-size: 12px; color: var(--sub); }
  table.mtab .ok { font-size: 22px; line-height: 1; }
  table.mtab .no { display: inline-block; width: 20px; height: 20px; border-radius: 50%; border: 3px dashed #E2D3BD; vertical-align: middle; }
  table.mtab .na { color: #D8CBB6; }
  table.mtab .sun-c { color: #E0567A; } table.mtab .sat-c { color: #3B8FD6; }

  /* ---------- おてがみ ---------- */
  .letter { background: #FFFDF6; border-radius: var(--radius); padding: 18px 20px; margin-bottom: 14px; box-shadow: 0 7px 0 var(--line);
    background-image: repeating-linear-gradient(transparent, transparent 33px, #F3E6CF 34px); line-height: 34px; }
  .letter .from { font-size: 15px; color: var(--pink); }
  .letter .txt { font-size: 19px; white-space: pre-wrap; }
  .letter.new { outline: 4px solid var(--pink); }

  /* ---------- 下のタブ ---------- */
  nav.tabs {
    position: fixed; left: 0; right: 0; bottom: 0; background: #fff; display: flex; justify-content: center;
    gap: 4px; padding: 8px 8px calc(8px + env(safe-area-inset-bottom)); box-shadow: 0 -4px 16px rgba(0,0,0,.06); z-index: 10;
  }
  nav.tabs button { flex: 1; max-width: 150px; border-radius: 16px; padding: 6px 4px; font-size: 14px; position: relative; }
  nav.tabs button b { display: block; font-size: 30px; line-height: 1.15; }
  nav.tabs button.on { background: var(--soft); }
  nav.tabs .dot { position: absolute; top: 4px; right: 22%; width: 14px; height: 14px; background: var(--pink); border-radius: 50%; border: 2px solid #fff; }
  .wiggle { animation: wiggle 1s ease-in-out infinite; display: inline-block; }
  @keyframes wiggle { 0%,100% { transform: rotate(0); } 25% { transform: rotate(-12deg); } 75% { transform: rotate(12deg); } }

  /* ---------- おとなよう ---------- */
  .adult { font-weight: 500; font-family: system-ui, -apple-system, 'Segoe UI', 'Yu Gothic UI', sans-serif; }
  .adult h3 { font-weight: 700; }
  .adult label { display: block; font-size: 14px; color: var(--sub); margin: 10px 0 4px; }
  .adult textarea, .adult select, .adult input {
    width: 100%; font: inherit; font-size: 16px; padding: 10px 12px; border-radius: 12px; border: 2px solid var(--line); background: #fff; color: var(--ink);
  }
  .adult textarea { min-height: 120px; resize: vertical; }
  .btn { background: var(--accent); color: #fff; border-radius: 12px; padding: 10px 18px; font-weight: 700; margin-top: 10px; }
  .btn.sub { background: #EFE5D6; color: var(--ink); }
  table.sum { width: 100%; border-collapse: collapse; font-size: 14px; }
  table.sum th, table.sum td { padding: 6px 4px; border-bottom: 1px solid var(--line); text-align: center; }
  table.sum th:first-child, table.sum td:first-child { text-align: left; }
  .row { display: flex; gap: 10px; flex-wrap: wrap; }
  .row > * { flex: 1; min-width: 140px; }
  .muted { color: var(--sub); font-size: 13px; }

  /* ---------- しばまるの にわ ---------- */
  .hero2 { background: var(--card); border-radius: var(--radius); padding: 14px 14px 12px; box-shadow: 0 6px 0 var(--line); }
  .hero2 .htop { display: flex; justify-content: space-between; align-items: flex-end; gap: 8px; margin-bottom: 6px; }
  .hero2 h1 { margin: 0; font-size: 13px; color: var(--sub); font-weight: 700; }
  .hero2 .name { font-size: 22px; font-weight: 900; }
  .hero2 .name small { font-size: 14px; color: var(--sub); margin-left: 2px; }
  .hero2 .meta { display: flex; gap: 6px; flex-shrink: 0; }
  .hero2.mini { padding: 10px 14px; }
  .hero2.mini .name { font-size: 18px; display: flex; align-items: center; gap: 4px; }
  .barmsg { font-size: 12px; color: var(--sub); text-align: right; margin: 3px 2px 8px; }
  .yard { position: relative; height: 210px; border-radius: 18px; overflow: hidden; touch-action: none; user-select: none; -webkit-user-select: none;
    background: linear-gradient(#9ED8FF 0, #D9F1FF 58%, #9BD67F 58%, #7FC463 100%); }
  .yard.morning { background: linear-gradient(#FFD9B0 0, #FFF1DD 58%, #A5DA85 58%, #86C76A 100%); }
  .yard.evening { background: linear-gradient(#FFB27A 0, #FFD8B5 58%, #8FC46F 58%, #74AE58 100%); }
  .yard.night { background: linear-gradient(#1E2A55 0, #3B4A80 58%, #3E6B40 58%, #2F5532 100%); }
  .yard .sky .sun { position: absolute; top: 12px; right: 18px; width: 38px; height: 38px; border-radius: 50%; background: #FFD84D; box-shadow: 0 0 20px #FFE680; }
  .yard.evening .sky .sun { background: #FF8A3D; top: 60px; }
  .yard.night .sky .sun { display: none; }
  .yard .cloud { position: absolute; font-size: 34px; opacity: .9; animation: drift 40s linear infinite; }
  .yard .cloud.c1 { top: 8px; } .yard .cloud.c2 { top: 46px; animation-delay: -20s; font-size: 26px; }
  .yard.night .cloud { opacity: .25; }
  .yard .deco span { position: absolute; line-height: 1; pointer-events: none; }
  .yard .deco .moon { left: 82%; top: 12px; font-size: 30px; } .yard .deco .stars { left: 20%; top: 18px; font-size: 20px; }
  .yard .dog { position: absolute; bottom: 22px; left: 50%; transform: translateX(-50%); width: calc(86px * var(--size, 1)); text-align: center; cursor: grab; touch-action: none; z-index: 2; }
  .yard .dogbody { position: relative; display: inline-block; font-size: calc(70px * var(--size, 1)); line-height: 1; transform-origin: 50% 100%; }
  .yard .dogbody .face { display: inline-block; transition: transform .25s; }
  .yard .dogbody .badge { top: -8px; right: -10px; }
  .yard .dogbody .acc { top: -14px; left: -4px; }
  .yard .shadow { width: 70%; height: 10px; margin: -4px auto 0; border-radius: 50%; background: rgba(0,0,0,.15); }
  .yard .dog.walking .dogbody { animation: trot .3s ease-in-out infinite; }
  @keyframes trot { 50% { transform: translateY(-7px) rotate(-3deg); } }
  .yard .dog.sleep .dogbody { transform: rotate(-8deg) scaleY(.88); filter: saturate(.8) brightness(.95); }
  .yard .bubble { position: absolute; bottom: 100%; left: 50%; transform: translate(-50%, 6px) scale(.6); background: #fff; border-radius: 16px; padding: 4px 10px; font-size: 18px; white-space: nowrap;
    box-shadow: 0 3px 8px rgba(0,0,0,.15); opacity: 0; transition: .2s; pointer-events: none; margin-bottom: 4px; }
  .yard .bubble.show { opacity: 1; transform: translate(-50%, 0) scale(1); }
  .yard .bubble::after { content: ''; position: absolute; left: 50%; top: 100%; border: 7px solid transparent; border-top-color: #fff; transform: translateX(-50%); }
  .yard .yhint { position: absolute; left: 0; right: 0; bottom: 4px; text-align: center; font-size: 12px; color: rgba(0,0,0,.45); transition: opacity .6s; pointer-events: none; }
  .yard.night .yhint { color: rgba(255,255,255,.6); }
  .yard .ball { position: absolute; bottom: 26px; font-size: 26px; opacity: 0; transform: translateX(-50%); pointer-events: none; z-index: 1; }
  .yard .ball.show { opacity: 1; }
  .yard .ball.fly { animation: toss .9s cubic-bezier(.3,.7,.5,1); }
  @keyframes toss { 40% { bottom: 120px; } 100% { bottom: 26px; } }
  .a-jump { animation: djump .6s ease; } @keyframes djump { 35% { transform: translateY(-46px) scale(1.06); } 70% { transform: translateY(0) scale(1.08,.92); } }
  .a-happy { animation: wag .25s ease-in-out 5; } @keyframes wag { 50% { transform: rotate(8deg); } }
  .a-sit { animation: sit 1.2s ease; } @keyframes sit { 20%, 80% { transform: scaleY(.82) translateY(4px); } }
  .a-sniff { animation: sniff .4s ease-in-out 3; } @keyframes sniff { 50% { transform: translateY(6px) rotate(-6deg); } }
  .a-eat { animation: eat .9s ease; }
  .a-paw { animation: paw 1.4s ease; } @keyframes paw { 20%, 70% { transform: rotate(-14deg) translateY(-6px); } }
  .a-spin { animation: spin 1s ease; } @keyframes spin { to { transform: rotate(360deg); } }
  .a-roll { animation: roll 1.4s ease; } @keyframes roll { 30% { transform: rotate(90deg) translateY(10px); } 60% { transform: rotate(270deg) translateY(10px); } 100% { transform: rotate(360deg); } }
  .a-dance { animation: dance 1.6s ease; } @keyframes dance { 15%, 45%, 75% { transform: rotate(-12deg) translateY(-10px); } 30%, 60%, 90% { transform: rotate(12deg); } }
  .a-bang { animation: bang 1.6s ease forwards; } @keyframes bang { 15% { transform: translateY(-10px); } 40%, 85% { transform: rotate(90deg) translate(8px, 10px); } 100% { transform: rotate(0); } }
  .petstatus { display: flex; align-items: center; gap: 6px; margin: 10px 0 8px; font-size: 13px; flex-wrap: wrap; }
  .fbar { flex: 1; min-width: 50px; height: 10px; background: #F3EBDD; border-radius: 99px; overflow: hidden; }
  .fbar > i { display: block; height: 100%; background: linear-gradient(90deg, #FFB3C8, var(--pink)); }
  .flybone.drag { transition: none; transform: scale(1.2); }

  /* ---------- さんすう ---------- */
  .math-intro { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; }
  .mdog { font-size: 64px; line-height: 1; display: inline-block; }

  /* ---------- 共通：ダイアログ・トースト・紙吹雪 ---------- */

<body>
<div id="app" class="wrap"><div class="loading"><b>🐶</b>よみこみちゅう…</div></div>
<nav class="tabs" id="tabs" hidden></nav>

<script>
/* =====================================================================
 *  そだててできた — 画面（子ども用＋おとなよう）
 *  データはすべて Code.gs の getData() から受け取り、集計はここで行います。
 *  google.script.run が無い環境（ローカルでファイルを開いたとき）は
 *  「おためしモード」になり、ブラウザ内にデータを保存して動きます。
 * ===================================================================== */
var IS_GAS = typeof google !== 'undefined' && google.script && google.script.run;
var DATA = null, VIEW = 'today', SELECTED = null, ADULT_OK = false, ADULT_WEEK = null, MONTH = null;
var audioCtx = null;

/* ---------- 小さな道具 ---------- */
var LS = {
  get: function (k, d) { try { var v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set: function (k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
};
var SOUND = LS.get('hw-sound', true);
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
function pick(a) { return a[Math.floor(Math.random() * a.length)]; }

/* ---------- 日付 ---------- */
var DOW = ['にち', 'げつ', 'か', 'すい', 'もく', 'きん', 'ど'];
function parseD(s) { var p = s.split('-').map(Number); return new Date(p[0], p[1] - 1, p[2]); }
function fmtD(d) { return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
function addDays(s, n) { var d = parseD(s); d.setDate(d.getDate() + n); return fmtD(d); }
function weekStart(s) { var d = parseD(s); d.setDate(d.getDate() - ((d.getDay() + 6) % 7)); return fmtD(d); }
function dow(s) { return parseD(s).getDay(); }
function jpDate(s) { var d = parseD(s); return (d.getMonth() + 1) + 'がつ ' + d.getDate() + 'にち（' + DOW[d.getDay()] + '）'; }
function md(s) { var d = parseD(s); return (d.getMonth() + 1) + '/' + d.getDate(); }

/* ---------- サーバー呼び出し ---------- */
function call(fn) {
  var args = Array.prototype.slice.call(arguments, 1);
  if (IS_GAS) {
    return new Promise(function (res, rej) {
      var r = google.script.run.withSuccessHandler(res).withFailureHandler(rej);
      r[fn].apply(r, args);
    });
  }
  if (apiUrl()) {
    // GitHub Pages → Apps Script API。text/plain で送ると CORS の事前確認が起きない
    return fetch(apiUrl(), {
      method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ key: LS.get('hw-key', ''), fn: fn, args: args })
    }).then(function (r) { return r.json(); }).then(function (j) {
      if (!j.ok) { var e = new Error(j.error); e.code = j.error; throw e; }
      // 毎月の設定（タスク・キャラ・アイテム）は、この画面と一緒に公開している Program.gs を使う
      if (j.data && typeof PROGRAM !== 'undefined') j.data.program = PROGRAM;
      return j.data;
    });
  }
  return Demo[fn].apply(Demo, args);
}
function apiUrl() { return (window.APP_CONFIG && window.APP_CONFIG.apiUrl) || ''; }

/* ---------- 集計 ---------- */
function P() { return DATA.program; }
function tasksFor(s) { var w = dow(s); return P().tasks.filter(function (t) { return !t.days || t.days.indexOf(w) >= 0; }); }
function isDone(s, id) { return DATA.records.some(function (r) { return r.date === s && r.taskId === id; }); }
function dayStatus(s) {
  var ts = tasksFor(s), done = ts.filter(function (t) { return isDone(s, t.id); }).length;
  return { total: ts.length, done: done, complete: ts.length > 0 && done === ts.length };
}
function sumStars(pred) { return DATA.records.filter(pred).reduce(function (a, r) { return a + (Number(r.stars) || 0); }, 0); }
function monthStars() { var m = DATA.today.slice(0, 7); return sumStars(function (r) { return r.date.indexOf(m) === 0; }); }
function weekStars(ws) { var we = addDays(ws, 6); return sumStars(function (r) { return r.date >= ws && r.date <= we; }); }
function stageOf(st) {
  var ss = P().character.stages, cur = ss[0], next = null;
  for (var i = 0; i < ss.length; i++) { if (st >= ss[i].at) cur = ss[i]; else { next = ss[i]; break; } }
  return { cur: cur, next: next };
}
function streak() {
  var d = DATA.today, n = 0;
  if (!dayStatus(d).complete) d = addDays(d, -1);
  for (var i = 0; i < 60; i++) {
    var st = dayStatus(d);
    if (st.total > 0) { if (!st.complete) break; n++; }
    d = addDays(d, -1);
  }
  return n;
}
function moodOn(s) { var m = DATA.moods.filter(function (x) { return x.date === s; })[0]; return m ? m.mood : null; }
function moodDef(id) { return P().moods.filter(function (m) { return m.id === id; })[0]; }
function unreadCount() {
  var last = LS.get('hw-read', '');
  return DATA.comments.filter(function (c) { return c.ts > last; }).length;
}

/* ---------- しばまる（ほね・きせかえ・さんぽ） ---------- */
function petRows(kind) { return (DATA.pet || []).filter(function (p) { return p.kind === kind; }); }
function allStars() { return sumStars(function () { return true; }); }
function bonesLeft() { return Math.max(0, allStars() - petRows('feed').length); }
function fedToday() { return petRows('feed').filter(function (p) { return p.date === DATA.today; }).length; }
function fullAt() { return (P().pet && P().pet.fullAt) || 4; }
function items() { return P().items || []; }
function itemById(id) { return items().filter(function (x) { return x.id === id; })[0] || null; }
function wornItem() {
  var w = petRows('wear'); if (!w.length) return null;
  var it = itemById(w[w.length - 1].value);
  return it && allStars() >= it.at ? it : null;
}
function itemsUnlockedAt(st) { return items().filter(function (x) { return st >= x.at; }); }
function nextItem() { var st = allStars(); return items().filter(function (x) { return x.at > st; })[0] || null; }
function walkSpot(d) {
  var ws = (P().pet && P().pet.walks) || [{ emoji: '🌳', name: 'こうえん' }];
  return ws[Math.floor(parseD(d).getTime() / 86400000) % ws.length];
}

/* ---------- 描画 ---------- */
function render() {
  document.documentElement.style.setProperty('--accent', (P().theme && P().theme.color) || '#FF8A3D');
  document.title = P().appTitle;
  var html = '';
  if (VIEW === 'today') html = viewToday();
  else if (VIEW === 'math') html = viewMath();
  else if (VIEW === 'week') html = viewWeek();
  else if (VIEW === 'adult') html = ADULT_OK ? viewAdult() : '';
  if (YARD && YARD.parentNode) YARD.parentNode.removeChild(YARD);
  document.getElementById('app').innerHTML = html;
  attachYard();
  renderTabs();
  if (VIEW === 'week') LS.set('hw-read', DATA.comments.reduce(function (a, c) { return c.ts > a ? c.ts : a; }, LS.get('hw-read', '')));
}

function renderTabs() {
  var tabs = document.getElementById('tabs');
  tabs.hidden = false;
  var un = VIEW === 'week' ? 0 : unreadCount();
  var items = [
    ['today', '📝', 'きょう'],
    ['math', '🔢', 'さんすう'],
    ['week', un ? '<span class="wiggle">💌</span>' : '📅', 'こんげつ'],
    ['adult', '🔒', 'おとなよう']
  ];
  tabs.innerHTML = items.map(function (it) {
    return '<button class="' + (VIEW === it[0] ? 'on' : '') + '" onclick="go(\'' + it[0] + '\')"><b>' + it[1] + '</b>' + it[2] +
      (it[0] === 'week' && un ? '<span class="dot"></span>' : '') + '</button>';
  }).join('');
}

function tagHtml(t) { return t.tag ? '<span class="tag" style="background:' + esc(t.tagColor || '') + '">' + esc(t.tag) + '</span>' : ''; }
function petHtml(st, item) {
  if (item === undefined) item = wornItem();
  return st.emoji + (st.badge ? '<span class="badge">' + st.badge + '</span>' : '') + (item ? '<span class="acc">' + item.emoji + '</span>' : '');
}

function heroHtml() {
  var st = monthStars(), sg = stageOf(st), pct = 100, msg = 'さいごまで そだったよ！';
  if (sg.next) { pct = Math.round((st - sg.cur.at) / (sg.next.at - sg.cur.at) * 100); msg = 'あと ★' + (sg.next.at - st) + ' で そだつよ'; }
  var sk = streak();
  return '<div class="hero2">' +
    '<div class="htop"><div><h1>' + esc(P().monthTitle) + '</h1>' +
    '<div class="name">' + esc(P().character.name) + '<small>（' + esc(sg.cur.title) + '）</small></div></div>' +
    '<div class="meta"><span class="chip">⭐ ' + st + '</span>' + (sk > 0 ? '<span class="chip">🔥 ' + sk + 'にち</span>' : '') + '</div></div>' +
    '<div class="bar"><i style="width:' + Math.max(4, pct) + '%"></i></div><div class="barmsg">' + msg + '</div>' +
    '<div id="yardSlot"></div>' +
    '<div class="petstatus" id="petStatus">' + petStatusHtml() + '</div>' +
    '<div class="petbar">' +
    '<button class="pbtn bone" id="boneBtn" onpointerdown="boneDown(event)">🦴 <span id="boneCount">×' + bonesLeft() + '</span></button>' +
    '<span class="tummy" id="tummy" title="おなか">' + tummyHtml() + '</span>' +
    '<button class="pbtn" onclick="throwBall()">🎾</button>' +
    '<button class="pbtn" onclick="openTricks()">🎓</button>' +
    '<button class="pbtn" onclick="openBox()">🎁</button></div>' +
    '</div>';
}
function miniHero() {
  var st = monthStars(), sg = stageOf(st), pct = sg.next ? Math.round((st - sg.cur.at) / (sg.next.at - sg.cur.at) * 100) : 100;
  return '<div class="hero2 mini"><div class="htop"><div class="name">' + dogFaceHtml() + ' ' + esc(P().character.name) + '<small>（' + esc(sg.cur.title) + '）</small></div>' +
    '<div class="meta"><span class="chip">⭐ こんげつ ' + st + '</span></div></div><div class="bar"><i style="width:' + Math.max(4, pct) + '%"></i></div></div>';
}
function tummyHtml() {
  var n = fedToday(), f = fullAt(), s = '';
  for (var i = 0; i < f; i++) s += i < n ? '❤️' : '🤍';
  return s;
}

function viewToday() {
  var d = SELECTED, ts = tasksFor(d), s = dayStatus(d);
  var h = heroHtml();
  h += '<div class="day-head"><h2>' + (d === DATA.today ? 'きょう ' : '') + jpDate(d) + '</h2>' +
    (d !== DATA.today ? '<button class="pill-btn" onclick="selectDay(DATA.today)">きょうに もどる</button>' : '') + '</div>';
  if (d !== DATA.today) h += '<div class="notice">📌 ' + jpDate(d) + ' の ぶんを つけているよ</div>';
  if (!ts.length) return h + '<div class="rest">🌈 きょうは おやすみ！<br>ゆっくり あそんでね</div>';
  h += '<div class="tasks">' + ts.map(function (t) {
    var done = isDone(d, t.id);
    return '<button class="task' + (done ? ' done' : '') + '" data-task="' + esc(t.id) + '" onclick="tapTask(\'' + esc(t.id) + '\')">' +
      tagHtml(t) + '<div class="ic">' + t.icon + '</div><div class="lb">' + esc(t.label) + '</div>' +
      (done ? '' : '<div class="hint">' + esc(t.hint || '') + '</div>') +
      '<div class="st">' + '⭐'.repeat(t.stars || 1) + '</div>' +
      (done ? '<div class="stamp"><span>できた！</span></div>' : '') + '</button>';
  }).join('') + '</div>';
  if (s.complete) {
    var m = moodOn(d);
    h += '<div class="alldone"><div class="big">🎉 ' + esc(P().allDoneMessage) + '</div>' +
      '<div style="margin-bottom:8px">' + (m ? 'きょうの きもち、ありがとう！' : 'きょうの きもちは どうだった？') + '</div>' +
      '<div class="moods">' + P().moods.map(function (x) {
        return '<button class="mood' + (m === x.id ? ' on' : '') + '" onclick="chooseMood(\'' + x.id + '\')"><b>' + x.emoji + '</b>' + esc(x.label) + '</button>';
      }).join('') + '</div>' +
      '<button class="walk-btn" onclick="goWalk()">🐕 しばまると ' + esc(walkSpot(d).name) + 'へ さんぽに いく！</button></div>';
  } else {
    h += '<div class="notice" style="margin-top:16px;text-align:center">あと ' + (s.total - s.done) + 'こ で ' + (P().theme.stamp || '🌟') + ' スタンプ！</div>';
  }
  return h;
}

function viewWeek() {
  var ws = weekStart(DATA.today), ws_st = weekStars(ws), goal = P().weeklyGoal, h = miniHero();
  var pct = Math.min(100, Math.round(ws_st / goal.stars * 100)), got = ws_st >= goal.stars;

/** こんげつの ひょう：たて＝ひにち、よこ＝カテゴリー。しゅうの くぎりに ★ の小計 */
function monthTable() {
  var mon = MONTH || DATA.today.slice(0, 7), tasks = P().tasks, stamp = P().theme.stamp || '🌟';
  var first = mon + '-01', d0 = parseD(first), last = fmtD(new Date(d0.getFullYear(), d0.getMonth() + 1, 0));
  var minDay = addDays(DATA.today, -31);
  var prevM = fmtD(new Date(d0.getFullYear(), d0.getMonth() - 1, 1)).slice(0, 7);
  var nextM = fmtD(new Date(d0.getFullYear(), d0.getMonth() + 1, 1)).slice(0, 7);
  var h = '<div class="card"><div class="mnav"><button onclick="MONTH=\'' + prevM + '\';render()">◀</button>' +
    '<h3>📅 ' + (d0.getMonth() + 1) + 'がつの ひょう</h3>' +
    '<button onclick="MONTH=\'' + nextM + '\';render()"' + (nextM > DATA.today.slice(0, 7) ? ' disabled' : '') + '>▶</button></div>';

  }).join('') + '<th>⭐</th><th>きもち</th></tr>';
  var wkStars = 0, colDone = tasks.map(function () { return 0; }), colPlan = tasks.map(function () { return 0; }), full = 0;
  for (var d = first; d <= last; d = addDays(d, 1)) {
    var w = dow(d), fut = d > DATA.today, ts = tasksFor(d), s = dayStatus(d), m = moodOn(d), dayStar = 0;
    var cells = tasks.map(function (t, i) {

      return '<td>' + (fut ? '' : '<span class="no"></span>') + '</td>';

    wkStars += dayStar; if (s.complete) full++;

      (canTap ? ' onclick="selectDay(\'' + d + '\')"' : '') + '>' +
      '<td><b>' + parseD(d).getDate() + '</b> <span class="dsub ' + (w === 0 ? 'sun-c' : w === 6 ? 'sat-c' : '') + '">' + DOW[w] + '</span>' + (s.complete ? ' ' + stamp : '') + '</td>' +

    '<td colspan="2">' + stamp + '×' + full + '</td></tr></table>';
  h += '<div class="muted" style="margin-top:10px;text-align:center">ひにちを おすと、その日の ぶんを つけられるよ</div></div>';

/* =====================================================================

  dog.addEventListener('pointerdown', function (e) { down = Date.now(); moved = 0; rubHearts = 0; lastX = e.clientX; lastY = e.clientY; try { dog.setPointerCapture(e.pointerId); } catch (x) {} });

/** しばまるが じぶんで かんがえて うごく */
function dogThink() {
  if (!document.getElementById('dog') || DOG.busy || DOG.sleeping) return;
  var idle = Date.now() - DOG.lastTouch;
  if (isNight() || idle > 120000) { if (Math.random() < 0.5) dogSleep(); return; }
  var r = Math.random();
  if (r < 0.42) dogWalkTo(10 + Math.random() * 78, 1100);
  else if (r < 0.55) { dogAnim('sit'); }
  else if (r < 0.66) { dogSay(pick(['👃', '🐾', '🎵', '❓']), 1300); dogAnim('sniff'); }
  else if (r < 0.76) { dogAnim('happy'); }
  else dogAsk();
}
/** おねだり：いま できる ことを しばまるが おしえて くれる */
function dogAsk() {
  var d = DATA.today, s = dayStatus(d), left = tasksFor(d).filter(function (t) { return !isDone(d, t.id); });
  if (bonesLeft() > 0 && fedToday() < fullAt()) return dogSay('🦴？', 2200);
  if (left.length) return dogSay(left[0].icon + '？', 2200);
  if (s.complete) return dogSay('🌳？', 2200);

}
function dogSay(text, ms) {

  b.textContent = text; b.classList.add('show');
  clearTimeout(b._t); b._t = setTimeout(function () { b.classList.remove('show'); }, ms || 1400);
}

}

/** ボールなげ：とおくへ なげると とって くる */

/** 1もん つくる：{ type, text, unit, ans, shiki, fig } */
function makeWQ(type) {
  var L = rpick(LINES), c = L.c, a, b, n;
  if (type === 'total') {
    a = rnd(3, 9); b = rnd(3, 9); n = a + b;
    return W(type, L.n + 'が 1れつに ならんで ' + L.v + '。\n' + L.who + 'は まえから ' + a + 'ばんめ です。\n' + L.who + 'の うしろには ' + b + c + ' ' + L.v + '。\n' + L.n + 'は ぜんぶで ' + nan(c) + ' ' + L.v.replace('ます', 'ますか') + '？',
      c, n, a + ' ＋ ' + b + ' ＝ ' + n,
      line(L, n, [a - 1], 'まえ', 'うしろ', [{ f: 0, t: a - 1, l: a + c, up: 1 }, { f: a, t: n - 1, l: b + c, up: 1 }]));
  }
  if (type === 'behind') {
    n = rnd(9, 15); a = rnd(3, n - 3);
    return W(type, L.n + 'が ' + n + c + ' 1れつに ならんで ' + L.v + '。\n' + L.who + 'は まえから ' + a + 'ばんめ です。\n' + L.who + 'の うしろには ' + nan(c) + ' ' + L.v.replace('ます', 'ますか') + '？',
      c, n - a, n + ' − ' + a + ' ＝ ' + (n - a),
      line(L, n, [a - 1], 'まえ', 'うしろ', [{ f: 0, t: a - 1, l: 'まえから ' + a, up: 1 }, { f: a, t: n - 1, l: '？', up: 1 }, { f: 0, t: n - 1, l: 'ぜんぶで ' + n + c, up: 0 }]));
  }
  if (type === 'front') {
    a = rnd(4, 11); n = a + 1 + rnd(1, 3);
    return W(type, L.n + 'が 1れつに ならんで ' + L.v + '。\n' + L.who + 'の まえには ' + a + c + ' ' + L.v + '。\n' + L.who + 'は まえから なんばんめ ですか？',
      'ばんめ', a + 1, a + ' ＋ 1 ＝ ' + (a + 1),
      line(L, n, [a], 'まえ', 'うしろ', [{ f: 0, t: a - 1, l: a + c, up: 1 }, { f: 0, t: a, l: 'まえから ？ばんめ', up: 0 }]));
  }
  if (type === 'ends') {
    a = rnd(3, 9); b = rnd(3, 9); n = a + b - 1;
    return W(type, L.n + 'が よこに 1れつに ならんで ' + L.v + '。\n' + L.who + 'は ひだりから ' + a + 'ばんめ、みぎから ' + b + 'ばんめ です。\n' + L.n + 'は みんなで ' + nan(c) + ' ' + L.v.replace('ます', 'ますか') + '？',
      c, n, a + ' ＋ ' + b + ' − 1 ＝ ' + n,
      line(L, n, [a - 1], 'ひだり', 'みぎ', [{ f: 0, t: a - 1, l: 'ひだりから ' + a, up: 1 }, { f: a - 1, t: n - 1, l: 'みぎから ' + b, up: 0 }]),
      L.who + 'を 2かい かぞえて いないかな？');
  }
  if (type === 'between') {
    a = rnd(2, 6); b = a + rnd(3, 8); n = b + rnd(1, 3);
    return W(type, L.n + 'が 1れつに ならんで ' + L.v + '。\n' + L.who + 'は まえから ' + a + 'ばんめ、' + L.who2 + 'は まえから ' + b + 'ばんめ です。\n' + L.who + 'と ' + L.who2 + 'の あいだには ' + nan(c) + ' ' + L.v.replace('ます', 'ますか') + '？',
      c, b - a - 1, b + ' − ' + a + ' − 1 ＝ ' + (b - a - 1),
      line(L, n, [a - 1, b - 1], 'まえ', 'うしろ', [{ f: 0, t: a - 1, l: a + 'ばんめ', up: 1 }, { f: 0, t: b - 1, l: b + 'ばんめ', up: 0 }, { f: a, t: b - 2, l: '？', up: 1 }]),
      L.who2 + 'は かぞえて いないかな？');
  }
  if (type === 'behindrank') {
    n = rnd(9, 15); a = rnd(3, n - 2);
    return W(type, L.n + 'が ' + n + c + ' 1れつに ならんで ' + L.v + '。\n' + L.who + 'は まえから ' + a + 'ばんめ です。\n' + L.who + 'は うしろから かぞえると なんばんめ ですか？',
      'ばんめ', n - a + 1, n + ' − ' + a + ' ＋ 1 ＝ ' + (n - a + 1),
      line(L, n, [a - 1], 'まえ', 'うしろ', [{ f: 0, t: a - 1, l: 'まえから ' + a, up: 1 }, { f: a - 1, t: n - 1, l: 'うしろから ？', up: 0 }]),
      L.who + 'も いれて かぞえよう');
  }
  if (type === 'give' || type === 'gotback') {
    var g = rpick(GIVES), tk = rpick(TAKERS);
    b = rnd(5, 9); var left = rnd(2, 7); a = b + left;
    if (type === 'give') return W(type, g.n + 'が ' + a + g.c + ' あります。\n' + b + tk.c + 'の ' + tk.n + 'に 1' + g.c + 'ずつ あげると、\n' + g.n + 'は ' + nan(g.c) + ' のこりますか？',
      g.c, left, a + ' − ' + b + ' ＝ ' + left, pair(g.n, g.e, a, tk.n, tk.e, b, 'のこり ？'), tk.n + 'の かずだけ ' + g.n + 'が へるね');
    return W(type, b + tk.c + 'の ' + tk.n + 'が ' + g.n + 'を 1' + g.c + 'ずつ もらいました。\nすると ' + g.n + 'は ' + left + g.c + ' のこりました。\n' + g.n + 'は はじめに ' + nan(g.c) + ' ありましたか？',
      g.c, a, b + ' ＋ ' + left + ' ＝ ' + a, pair(g.n, g.e, a, tk.n, tk.e, b, 'のこり ' + left + g.c), 'もらった ぶんと のこりを あわせよう');
  }
  if (type === 'seats') {

      st.bc, b - a, b + ' − ' + a + ' ＝ ' + (b - a), pair(st.a, st.ae, a, st.b, st.be, b, '？'), '1つずつ せんで むすんで みよう');
  }
  // more / less

    cp.c, a + b, a + ' ＋ ' + b + ' ＝ ' + (a + b), bars(cp.x, cp.ex, a, cp.y, cp.ey, a + b, b, 'おおい'), 'おおい ほうは たしざん かな？');
  if (a - b < 2) a = b + rnd(2, 6);
  return W('less', cp.x + 'は ' + a + cp.c + ' ' + cp.v + '。\n' + cp.y + 'は ' + cp.x + 'より ' + b + cp.c + ' すくない そうです。\n' + cp.y + 'は ' + nan(cp.c) + ' ですか？',
    cp.c, a - b, a + ' − ' + b + ' ＝ ' + (a - b), bars(cp.x, cp.ex, a, cp.y, cp.ey, a - b, b, 'すくない'), 'すくない ほうは ひきざん かな？');
}
function W(type, text, unit, ans, shiki, fig, tip) { return { type: type, text: text, unit: unit, ans: ans, shiki: shiki, fig: fig, tip: tip || 'ずを みて かぞえて みよう' }; }
function line(L, n, marks, left, right, braces) { return { t: 'line', n: n, e: L.e, marks: marks, me: [L.we, L.we2], left: left, right: right, braces: braces }; }

/** ず（えもじで かく） */

    });
    for (var i = 0; i < f.n; i++) {

    }
    return '<div class="fig"><div class="fends"><span>' + esc(f.left) + '</span><span>' + esc(f.right) + '</span></div>' +
      '<div class="frow" style="' + cols + '">' + up + '</div><div class="frow items" style="' + cols + '">' + items + '</div><div class="frow" style="' + cols + '">' + dn + '</div></div>';

    '<div class="fnote">🟡 ＝ ' + f.diff + ' ' + esc(f.word) + '</div></div>';
}

/** その日の もんだい（日づけで きまる） */

  var pl = planFor(d), cnt = mathCfg().count || 4, out = [], seen = {};

    var qq = makeWQ(pl.types[i % pl.types.length]);
    if (seen[qq.text]) continue; seen[qq.text] = 1; out.push(qq); i++;

}

  var pl = mathCfg().plan[pi], out = [];

}

/* ---------- おとなよう ---------- */
function weekSummary(ws) {
  var total = 0, done = 0, full = 0, moods = [];
  for (var i = 0; i < 7; i++) {
    var d = addDays(ws, i); if (d > DATA.today) break;
    var s = dayStatus(d); total += s.total; done += s.done; if (s.complete) full++;
    var m = moodOn(d); if (m && moodDef(m)) moods.push(moodDef(m).emoji);
  }
  return { stars: weekStars(ws), total: total, done: done, full: full, rate: total ? Math.round(done / total * 100) : 0, moods: moods.join('') };
}

function viewAdult() {
  var thisWeek = weekStart(DATA.today);
  if (!ADULT_WEEK) ADULT_WEEK = thisWeek;
  var opts = '';
  for (var k = 0; k < 8; k++) { var w = addDays(thisWeek, -7 * k); opts += '<option value="' + w + '"' + (w === ADULT_WEEK ? ' selected' : '') + '>' + md(w) + ' 〜 ' + md(addDays(w, 6)) + (k === 0 ? '（今週）' : '') + '</option>'; }
  var s = weekSummary(ADULT_WEEK);
  var dayRows = '';
  for (var i = 0; i < 7; i++) {
    var d = addDays(ADULT_WEEK, i), ts = tasksFor(d);
    dayRows += '<tr><td>' + md(d) + '(' + DOW[dow(d)] + ')</td>' + P().tasks.map(function (t) {
      return '<td>' + (ts.indexOf(t) < 0 ? '–' : (isDone(d, t.id) ? '✅' : (d > DATA.today ? '' : '・'))) + '</td>';
    }).join('') + '<td>' + (moodOn(d) && moodDef(moodOn(d)) ? moodDef(moodOn(d)).emoji : '') + '</td></tr>';
  }
  var wc = DATA.comments.filter(function (c) { return c.week === ADULT_WEEK; });
  var hist = '';
  for (var j = 0; j < 8; j++) {
    var w2 = addDays(thisWeek, -7 * j), s2 = weekSummary(w2);
    hist += '<tr><td>' + md(w2) + '〜</td><td>' + s2.stars + '</td><td>' + s2.full + '</td><td>' + s2.rate + '%</td><td>' + s2.moods + '</td><td>' +
      DATA.comments.filter(function (c) { return c.week === w2; }).length + '</td></tr>';
  }
  var months = {}; DATA.records.forEach(function (r) { months[r.date.slice(0, 7)] = 1; }); months[DATA.today.slice(0, 7)] = 1;
  var mOpts = Object.keys(months).sort().reverse().map(function (m) { return '<option>' + m + '</option>'; }).join('');

  return '<div class="adult">' +
    '<div class="day-head"><h2>🔒 おとなよう</h2><button class="pill-btn" onclick="ADULT_OK=false;go(\'today\')">とじる</button></div>' +
    '<div class="card"><h3>週を選ぶ</h3><select onchange="ADULT_WEEK=this.value;render()">' + opts + '</select>' +
    '<div class="row" style="margin-top:12px"><div>⭐ ' + s.stars + '</div><div>全部できた日 ' + s.full + '日</div><div>達成率 ' + s.rate + '%</div><div>きもち ' + (s.moods || '—') + '</div></div>' +
    '<div style="overflow-x:auto;margin-top:10px"><table class="sum"><tr><th>日</th>' + P().tasks.map(function (t) { return '<th title="' + esc(t.label) + '">' + t.icon + '</th>'; }).join('') + '<th>😊</th></tr>' + dayRows + '</table></div></div>' +

    '<div class="card"><h3>💌 この週のコメントを書く</h3>' +
    (wc.length ? wc.map(function (c) { return '<div class="muted" style="margin-bottom:6px">' + esc(c.author) + '：' + esc(c.text) + '</div>'; }).join('') : '<div class="muted">この週のコメントはまだありません</div>') +
    '<label>だれから</label><select id="cAuthor"><option>ママ</option><option>パパ</option></select>' +
    '<label>コメント（子どもにも「おてがみ」として見えます。ひらがな多めがおすすめ）</label>' +
    '<textarea id="cText" placeholder="こんしゅうは ラズキッズを まいにち がんばったね！"></textarea>' +
    '<button class="btn" onclick="sendComment()">保存する</button></div>' +

    '<div class="card"><h3>📊 最近8週間</h3><div style="overflow-x:auto"><table class="sum"><tr><th>週</th><th>⭐</th><th>完了日</th><th>達成率</th><th>きもち</th><th>コメント</th></tr>' + hist + '</table></div></div>' +

    monthMathHtml() +
    '<div class="card"><h3>🤖 AI に渡す月まとめ（パパ用）</h3>' +
    '<div class="muted">月を選んで作成 → コピーして Claude に貼り付け、来月の Program.gs を一緒に作ります（docs/monthly-update.md 参照）。</div>' +
    '<div class="row" style="margin-top:8px"><select id="sumMonth">' + mOpts + '</select><button class="btn sub" style="margin-top:0" onclick="makeSummary()">まとめを作る</button></div>' +
    '<textarea id="sumOut" style="margin-top:10px;min-height:200px" readonly></textarea>' +
    '<button class="btn" onclick="copySummary()">コピー</button></div>' +
    (apiUrl() && !IS_GAS ? '<div style="text-align:center;margin-bottom:12px"><button class="btn sub" onclick="forgetKey()">この端末の あいことばを消す</button></div>' : '') +
    '<div class="muted" style="text-align:center">プログラム版: ' + esc(P().version) + (DATA.demo ? '（おためしモード）' : '') + '</div></div>';
}

function buildSummary(month) {
  var p = P(), lines = [];
  var first = month + '-01', d0 = parseD(first), last = fmtD(new Date(d0.getFullYear(), d0.getMonth() + 1, 0));
  if (last > DATA.today) last = DATA.today;
  lines.push('# しゅくだい まとめ ' + month, '');
  lines.push('- プログラム版: ' + p.version + '（' + p.monthTitle + '）');
  lines.push('- 週の目標: ★' + p.weeklyGoal.stars + ' / ごほうび: ' + p.weeklyGoal.reward);
  lines.push('- 注意: 達成率は「現在のプログラムのタスク予定」で計算しています', '');
  lines.push('## タスク別の達成率');
  lines.push('| タスク | 予定 | できた | 達成率 |', '|---|---|---|---|');
  p.tasks.forEach(function (t) {
    var plan = 0, ok = 0;
    for (var d = first; d <= last; d = addDays(d, 1)) { if (tasksFor(d).indexOf(t) >= 0) { plan++; if (isDone(d, t.id)) ok++; } }
    lines.push('| ' + t.icon + ' ' + t.label + ' (' + t.id + ') | ' + plan + ' | ' + ok + ' | ' + (plan ? Math.round(ok / plan * 100) : 0) + '% |');
  });
  lines.push('', '## 週ごと');
  lines.push('| 週(月曜) | ★ | 全部できた日 | 達成率 | きもち |', '|---|---|---|---|---|');
  for (var w = weekStart(first); w <= last; w = addDays(w, 7)) {
    var s = weekSummary(w);
    lines.push('| ' + w + ' | ' + s.stars + ' | ' + s.full + ' | ' + s.rate + '% | ' + (s.moods || '-') + ' |');
  }
  lines.push('', '## 曜日別の達成率');
  var byDow = [0, 0, 0, 0, 0, 0, 0].map(function () { return { t: 0, d: 0 }; });
  for (var dd = first; dd <= last; dd = addDays(dd, 1)) { var st = dayStatus(dd); byDow[dow(dd)].t += st.total; byDow[dow(dd)].d += st.done; }
  lines.push([1, 2, 3, 4, 5, 6, 0].map(function (i) { return DOW[i] + ': ' + (byDow[i].t ? Math.round(byDow[i].d / byDow[i].t * 100) + '%' : '-'); }).join(' / '));
  lines.push('', '## きもち');
  var mc = {}; DATA.moods.filter(function (m) { return m.date.indexOf(month) === 0; }).forEach(function (m) { mc[m.mood] = (mc[m.mood] || 0) + 1; });
  lines.push(p.moods.map(function (m) { return m.emoji + m.label + ': ' + (mc[m.id] || 0); }).join(' / '));
  lines.push('', '## ママ・パパのコメント');
  var cs = DATA.comments.filter(function (c) { return c.week >= weekStart(first) && c.week <= last; });
  if (!cs.length) lines.push('（なし）');
  cs.forEach(function (c) { lines.push('- [' + c.week + '週 / ' + c.author + '] ' + c.text.replace(/\n/g, ' ')); });
  lines.push('', '## 来月への希望（パパが書き足す）', '- ');
  return lines.join('\n');
}

/* ---------- 操作 ---------- */
function go(v) {
  if (v === 'adult' && !ADULT_OK) { return adultGate(); }
  if (v === 'today' && !SELECTED) SELECTED = DATA.today;
  VIEW = v; render(); window.scrollTo(0, 0);
}
function selectDay(d) { SELECTED = d; VIEW = 'today'; render(); window.scrollTo(0, 0); }

function tapTask(id) {
  var d = SELECTED, t = P().tasks.filter(function (x) { return x.id === id; })[0];
  if (isDone(d, id)) {
    confirmBox('「' + t.label + '」を<br>とりけす？', 'とりけす', 'やめる', function () {
      DATA.records = DATA.records.filter(function (r) { return !(r.date === d && r.taskId === id); });
      render(); sync(call('removeRecord', d, id));
    });
    return;
  }
  // さんすうは「さんすう」タブで もんだいを とくと できた！になる（きょうの ぶんだけ）
  if (t.math && d === DATA.today) { MATH = null; go('math'); return; }
  markDone(d, t, t.label, false);
}
function markDone(d, t, label, fromMath) {
  var id = t.id;
  var before = stageOf(monthStars()).cur, itemsBefore = itemsUnlockedAt(allStars()).length;
  DATA.records.push({ date: d, taskId: id, stars: t.stars || 1, ts: new Date().toISOString() });
  if (!fromMath) render(); else updatePetBar();
  var el = document.querySelector('[data-task="' + id + '"]');
  if (el) { el.classList.add('just'); floatPlus(el, '+' + '⭐'.repeat(t.stars || 1) + '🦴'); }
  if (!fromMath) { touchDog(); if (DOG.sleeping) dogWake(); dogAnim('jump'); dogSay(t.icon + '！', 1400); }
  var after = stageOf(monthStars()).cur, newItems = itemsUnlockedAt(allStars()).slice(itemsBefore);
  if (newItems.length) setTimeout(function () { foundItem(newItems[newItems.length - 1]); }, after !== before ? 2600 : 700);
  if (after !== before) { sound('level'); confetti(40); setTimeout(function () { levelUp(after); }, 500); }
  else if (dayStatus(d).complete) { sound('level'); confetti(45); toast('🎉 ぜんぶ できた！'); }
  else if (fromMath) { toast('🔢 さんすう できた！ +⭐🦴'); }
  else { sound('done'); confetti(14); toast(pick(P().cheers)); }
  sync(call('addRecord', d, id, label, t.stars || 1));
}

function chooseMood(m) {
  DATA.moods = DATA.moods.filter(function (x) { return x.date !== SELECTED; });
  DATA.moods.push({ date: SELECTED, mood: m, ts: new Date().toISOString() });
  render(); sound('done'); toast(moodDef(m).emoji + ' おしえてくれて ありがとう！');
  sync(call('setMood', SELECTED, m));
}

function sendComment() {
  var text = document.getElementById('cText').value.trim(), author = document.getElementById('cAuthor').value;
  if (!text) return toast('コメントを入力してください', true);
  DATA.comments.push({ week: ADULT_WEEK, author: author, text: text, ts: new Date().toISOString() });
  render(); toast('保存しました ✉️');
  sync(call('addComment', ADULT_WEEK, author, text));
}
function makeSummary() { document.getElementById('sumOut').value = buildSummary(document.getElementById('sumMonth').value); }
function copySummary() {
  var t = document.getElementById('sumOut'); if (!t.value) makeSummary();
  t.select();
  var ok = false; try { ok = document.execCommand('copy'); } catch (e) {}
  if (!ok && navigator.clipboard) navigator.clipboard.writeText(t.value);
  toast('コピーしました 📋');
}

/** サーバーの結果で上書き。失敗したら読み直す。 */
function sync(promise) {
  promise.then(function (fresh) {
    var same = JSON.stringify([fresh.records.length, fresh.moods.length, fresh.comments.length, (fresh.pet || []).length]) ===
      JSON.stringify([DATA.records.length, DATA.moods.length, DATA.comments.length, (DATA.pet || []).length]);
    DATA = fresh;
    if (!same) render();
  }).catch(function (e) {
    console.error(e);
    toast('うまく ほぞん できなかったよ。もういちど おしてね', true);
    call('getData').then(function (f) { DATA = f; render(); });
  });
}


/** ほねを あげる：ボタンから しばまるへ ほねが とんでいき、もぐもぐ（dropped = ゆびで はこんで きた） */
function feedPet(dropped) {
  var pet = document.getElementById('pet'), btn = document.getElementById('boneBtn');
  touchDog(); if (DOG.sleeping) dogWake();
  if (!bonesLeft()) { sound('pet'); dogSay('🦴…？', 1500); return toast('「できた！」で ほねが もらえるよ 🦴'); }
  if (fedToday() >= fullAt()) { sound('pet'); dogAnim('happy'); dogSay('おなか いっぱい', 1500); return toast('おなか いっぱい！ また あしたね'); }
  DATA.pet = DATA.pet || [];
  DATA.pet.push({ date: DATA.today, kind: 'feed', value: '', ts: new Date().toISOString() });
  DOG.busy = true;
  function eat() {
    updatePetBar(); dogAnim('eat', 1100); dogSay('😋', 1200);
    sound('eat'); hearts(document.getElementById('pet'), 5);
    setTimeout(function () { DOG.busy = false; }, 1100);
    if (fedToday() >= fullAt()) { setTimeout(function () { sound('level'); confetti(24); dogAnim('happy'); toast('おなか いっぱい！ しっぽ ぶんぶん！'); }, 900); }
    else toast(pick(['もぐもぐ… おいしい！', 'ワン！ ありがとう！', 'カリカリ… うまうま！', 'もう 1ぽん ほしいな〜']));
  }
  if (dropped === true || !btn || !pet) eat();
  else {
    var b = btn.getBoundingClientRect(), p = pet.getBoundingClientRect();
    var fb = document.createElement('div'); fb.className = 'flybone'; fb.textContent = '🦴';
    fb.style.left = (b.left + 6) + 'px'; fb.style.top = (b.top - 4) + 'px';
    document.body.appendChild(fb);
    requestAnimationFrame(function () { requestAnimationFrame(function () {
      fb.style.left = (p.left + p.width / 2 - 17) + 'px'; fb.style.top = (p.top + p.height / 2 - 10) + 'px'; fb.style.transform = 'rotate(360deg) scale(.7)';
    }); });
    setTimeout(function () { fb.remove(); eat(); }, 600);
  }
  sync(call('feedPet', DATA.today));
}
function petJump() { dogAnim('jump'); }
function hearts(el, n) {
  if (!el) return;
  var r = el.getBoundingClientRect();
  for (var i = 0; i < n; i++) (function (i) {
    setTimeout(function () {
      var h = document.createElement('div'); h.className = 'heart'; h.textContent = pick(['💕', '💛', '💖']);
      h.style.left = (r.left + r.width / 2 - 12 + (Math.random() * 40 - 20)) + 'px'; h.style.top = (r.top + 10) + 'px';
      h.style.setProperty('--x', (Math.random() * 60 - 30) + 'px');
      document.body.appendChild(h); setTimeout(function () { h.remove(); }, 1200);
    }, i * 120);
  })(i);
}

/** たからばこ：あつめた きせかえ アイテム */
function openBox() {
  var st = allStars(), worn = wornItem(), nx = nextItem(), sg = stageOf(monthStars());
  var grid = items().map(function (it) {
    if (st < it.at) return '<div class="box-item lock"><b>❓</b>あと ⭐' + (it.at - st) + '</div>';
    return '<button class="box-item' + (worn && worn.id === it.id ? ' on' : '') + '" data-item="' + esc(it.id) + '"><b>' + it.emoji + '</b>' + esc(it.name) + '</button>';
  }).join('');
  var o = overlay('<div class="q">🎁 しばまるの たからばこ</div>' +
    '<div class="box-pet" id="boxPet">' + petHtml(sg.cur, worn) + '</div>' +
    '<div class="muted">これまでの ⭐ ' + st + '　' + (nx ? 'つぎの アイテムまで あと ⭐' + (nx.at - st) : 'ぜんぶ みつけたよ！') + '</div>' +
    '<div class="box-grid">' + grid + '</div>' +
    '<div class="muted" style="margin-bottom:10px">おすと つけたり はずしたり できるよ</div>' +
    '<div class="acts"><button class="yes">とじる</button></div>');
  o.querySelector('.yes').onclick = function () { o.remove(); };
  [].forEach.call(o.querySelectorAll('[data-item]'), function (b) {
    b.onclick = function () {
      var id = b.getAttribute('data-item'), cur = wornItem(), next = cur && cur.id === id ? '' : id;
      DATA.pet = DATA.pet || [];
      DATA.pet.push({ date: DATA.today, kind: 'wear', value: next, ts: new Date().toISOString() });
      sound(next ? 'done' : 'pet');
      o.remove(); render(); openBox();
      if (next) { hearts(document.getElementById('boxPet'), 4); toast(pick(['にあう？', 'かっこいい！', 'おしゃれ でしょ！'])); }
      sync(call('wearItem', next));
    };
  });
}
function foundItem(it) {
  sound('level'); confetti(20);
  var o = overlay('<div class="big-pet" style="font-size:96px">' + it.emoji + '</div><div class="q">あたらしい アイテム！<br>「' + esc(it.name) + '」を みつけた！</div>' +
    '<div class="acts"><button class="no">あとで</button><button class="yes">つけてみる</button></div>', 'levelup');
  o.querySelector('.no').onclick = function () { o.remove(); };
  o.querySelector('.yes').onclick = function () {
    o.remove(); DATA.pet = DATA.pet || [];
    DATA.pet.push({ date: DATA.today, kind: 'wear', value: it.id, ts: new Date().toISOString() });
    render(); petJump(); hearts(document.getElementById('pet'), 4); sync(call('wearItem', it.id));
  };
}

/** さんぽ：その日の ぶんが ぜんぶ おわった ごほうび */
function goWalk() {
  var spot = walkSpot(SELECTED), sg = stageOf(monthStars());
  var finds = ['どんぐりを みつけた 🌰', 'きれいな はっぱを みつけた 🍁', 'ちょうちょと あそんだ 🦋', 'ともだちの いぬに あった 🐩', 'おいしい においが した 🍠', 'ぴかぴかの いしを みつけた 💎'];

/* ---------- 演出 ---------- */
function toast(msg, err) {
  var old = document.querySelector('.toast'); if (old) old.remove();
  var t = document.createElement('div'); t.className = 'toast' + (err ? ' err' : ''); t.textContent = msg;
  document.body.appendChild(t); setTimeout(function () { t.remove(); }, 1900);
}
function confetti(n) {
  var set = (P().theme && P().theme.confetti) || ['⭐'];
  for (var i = 0; i < n; i++) {
    var c = document.createElement('div'); c.className = 'confetti'; c.textContent = pick(set);
    c.style.left = Math.random() * 100 + 'vw';
    c.style.setProperty('--x', (Math.random() * 200 - 100) + 'px');
    c.style.setProperty('--r', (Math.random() * 720 - 360) + 'deg');
    c.style.setProperty('--d', (1.4 + Math.random() * 1.4) + 's');
    c.style.animationDelay = (Math.random() * .4) + 's';
    document.body.appendChild(c); (function (el) { setTimeout(function () { el.remove(); }, 3400); })(c);
  }
}
function floatPlus(el, text) {
  var r = el.getBoundingClientRect(), p = document.createElement('div');
  p.className = 'plus'; p.textContent = text; p.style.left = (r.left + r.width / 2 - 30) + 'px'; p.style.top = (r.top + 10) + 'px';
  document.body.appendChild(p); setTimeout(function () { p.remove(); }, 1000);
}
function sound(kind) {
  if (!SOUND) return;
  try {
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    var notes = { done: [784, 988, 1175], level: [523, 659, 784, 1047, 1319, 1568], pet: [660, 880], eat: [392, 330, 392, 330], step: [1400] }[kind] || [880];
    notes.forEach(function (f, i) {
      var o = audioCtx.createOscillator(), g = audioCtx.createGain(), t0 = audioCtx.currentTime + i * 0.09;
      o.type = 'triangle'; o.frequency.value = f;
      g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(0.25, t0 + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.25);
      o.connect(g); g.connect(audioCtx.destination); o.start(t0); o.stop(t0 + 0.3);
    });
  } catch (e) {}
}
function toggleSound() { SOUND = !SOUND; LS.set('hw-sound', SOUND); document.getElementById('soundBtn').textContent = SOUND ? '🔊' : '🔇'; if (SOUND) sound('pet'); }

function overlay(inner, cls) {
  var o = document.createElement('div'); o.className = 'overlay';
  o.innerHTML = '<div class="dialog ' + (cls || '') + '">' + inner + '</div>';
  o.addEventListener('click', function (e) { if (e.target === o) o.remove(); });
  document.body.appendChild(o); return o;
}
function confirmBox(q, yes, no, onYes) {
  var o = overlay('<div class="q">' + q + '</div><div class="acts"><button class="no">' + no + '</button><button class="yes">' + yes + '</button></div>');
  o.querySelector('.no').onclick = function () { o.remove(); };
  o.querySelector('.yes').onclick = function () { o.remove(); onYes(); };
}
function levelUp(stage) {
  var o = overlay('<div class="big-pet">' + petHtml(stage) + '</div><div class="q">' + esc(P().character.name) + 'が<br>「' + esc(stage.title) + '」に そだったよ！</div>' +
    '<div class="acts"><button class="yes">やったー！</button></div>', 'levelup');
  o.querySelector('.yes').onclick = function () { o.remove(); confetti(30); };
}
function adultGate() {
  // 1年生にはまだ難しい「かけ算」で、おとな用画面をそっと守る
  var a = 3 + Math.floor(Math.random() * 7), b = 3 + Math.floor(Math.random() * 7);
  var o = overlay('<div class="q">おとなの ひと へ<br><span style="font-size:28px">' + a + ' × ' + b + ' = ?</span></div>' +
    '<input type="number" inputmode="numeric" id="gateIn"><div class="acts"><button class="no">もどる</button><button class="yes">ひらく</button></div>');
  var inp = o.querySelector('#gateIn'); setTimeout(function () { inp.focus(); }, 50);
  function tryOpen() {
    if (Number(inp.value) === a * b) { o.remove(); ADULT_OK = true; VIEW = 'adult'; render(); window.scrollTo(0, 0); }
    else { inp.value = ''; inp.style.borderColor = '#FF7EA8'; }
  }
  o.querySelector('.no').onclick = function () { o.remove(); };
  o.querySelector('.yes').onclick = tryOpen;
  inp.addEventListener('keydown', function (e) { if (e.key === 'Enter') tryOpen(); });
}

/* ---------- おためしモード（google.script.run が無いとき） ---------- */
var Demo = {
  _load: function () {
    var s = LS.get('hw-demo', null);
    if (!s) { s = this._seed(); LS.set('hw-demo', s); }
    return s;
  },
  _seed: function () {
    var today = fmtD(new Date()), recs = [], moods = [];
    // 過去10日ぶん、だいたいできている記録を作る
    for (var i = 10; i >= 1; i--) {
      var d = addDays(today, -i), w = dow(d);
      PROGRAM.tasks.forEach(function (t, k) {
        if ((!t.days || t.days.indexOf(w) >= 0) && (i + k) % 5 !== 0) recs.push({ date: d, taskId: t.id, stars: t.stars || 1, ts: d + 'T18:00:00' });
      });
      if (i % 2 === 0) moods.push({ date: d, mood: PROGRAM.moods[i % PROGRAM.moods.length].id, ts: d + 'T19:00:00' });
    }
    return { records: recs, moods: moods, comments: [
      { week: weekStart(addDays(today, -7)), author: 'ママ', text: 'ラズキッズ、まいにち つづけて えらかったね！\nさんすうも どんどん はやく なってるよ。', ts: addDays(today, -2) + 'T21:00:00' }
    ] };
  },
  _ret: function (s) {
    return Promise.resolve(JSON.parse(JSON.stringify({ program: PROGRAM, today: fmtD(new Date()), records: s.records, moods: s.moods, comments: s.comments, pet: s.pet || [], demo: true })));
  },
  feedPet: function (d) {
    var s = this._load(); s.pet = s.pet || []; s.pet.push({ date: d, kind: 'feed', value: '', ts: new Date().toISOString() });
    LS.set('hw-demo', s); return this._ret(s);
  },
  wearItem: function (id) {
    var s = this._load(); s.pet = s.pet || []; s.pet.push({ date: fmtD(new Date()), kind: 'wear', value: id || '', ts: new Date().toISOString() });
    LS.set('hw-demo', s); return this._ret(s);
  },
  getData: function () { return this._ret(this._load()); },
  addRecord: function (d, id) {
    var s = this._load(), t = PROGRAM.tasks.filter(function (x) { return x.id === id; })[0];
    if (!s.records.some(function (r) { return r.date === d && r.taskId === id; })) s.records.push({ date: d, taskId: id, stars: t.stars || 1, ts: new Date().toISOString() });
    LS.set('hw-demo', s); return this._ret(s);
  },
  removeRecord: function (d, id) {
    var s = this._load(); s.records = s.records.filter(function (r) { return !(r.date === d && r.taskId === id); });
    LS.set('hw-demo', s); return this._ret(s);
  },
  setMood: function (d, m) {
    var s = this._load(); s.moods = s.moods.filter(function (x) { return x.date !== d; });
    s.moods.push({ date: d, mood: m, ts: new Date().toISOString() }); LS.set('hw-demo', s); return this._ret(s);
  },
  addComment: function (w, a, t) {
    var s = this._load(); s.comments.push({ week: w, author: a, text: t, ts: new Date().toISOString() });
    LS.set('hw-demo', s); return this._ret(s);
  }
};

/* ---------- 起動 ---------- */
function start() {
  if (!document.getElementById('soundBtn')) {
    var sb = document.createElement('button'); sb.className = 'sound'; sb.id = 'soundBtn'; sb.textContent = SOUND ? '🔊' : '🔇'; sb.onclick = toggleSound;
    document.body.appendChild(sb);
  }
  if (!IS_GAS && apiUrl() && !LS.get('hw-key', '')) return keyScreen('');
  document.getElementById('app').innerHTML = '<div class="loading"><b>🐶</b>よみこみちゅう…</div>';
  call('getData').then(function (d) {
    DATA = d; SELECTED = d.today;
    if (d.demo) { var b = document.createElement('div'); b.className = 'demo-badge'; b.textContent = 'おためしモード'; document.body.appendChild(b); }
    render();
  }).catch(function (e) {
    if (e && e.code === 'UNAUTHORIZED') { LS.set('hw-key', ''); return keyScreen('あいことばが ちがうみたい'); }
    document.getElementById('app').innerHTML = '<div class="loading"><b>😢</b>よみこめませんでした<br><small>' + esc(e && e.message) + '</small></div>';
  });
}

/** はじめて開いた端末で、おうちの人が あいことば を入れる画面 */
function keyScreen(err) {
  document.getElementById('tabs').hidden = true;
  document.getElementById('app').innerHTML =
    '<div class="card" style="margin-top:40px;text-align:center"><div style="font-size:70px">🐶🔑</div>' +
    '<h3>おうちの ひとに<br>「あいことば」を いれて もらってね</h3>' +
    (err ? '<div style="color:var(--pink);margin-bottom:8px">' + esc(err) + '</div>' : '') +
    '<div class="adult"><input id="keyIn" type="password" autocomplete="off" placeholder="あいことば">' +
    '<button class="btn" id="keyBtn" style="width:100%">はじめる</button>' +
    '<div class="muted" style="margin-top:8px">この端末に1回だけ保存されます</div></div></div>';
  var inp = document.getElementById('keyIn');
  function go2() { var v = inp.value.trim(); if (!v) return; LS.set('hw-key', v); start(); }
  document.getElementById('keyBtn').onclick = go2;
  inp.addEventListener('keydown', function (e) { if (e.key === 'Enter') go2(); });
}
function forgetKey() {
  confirmBox('この端末の あいことばを<br>けしますか？', 'けす', 'やめる', function () { LS.set('hw-key', ''); ADULT_OK = false; VIEW = 'today'; start(); });
}

function loadScript(src, cb) {
  var s = document.createElement('script'); s.src = src;
  s.onload = function () { cb(true); }; s.onerror = function () { cb(false); };
  document.head.appendChild(s);
}
if (IS_GAS) start();
else {
  // GitHub Pages / ローカル：config.js（API の URL）→ Program.gs（おためし用）の順に読み込む
  // ?v= を付けて、ブラウザのキャッシュではなく いつも最新の設定を読む（月替わりですぐ反映されるように）
  var v = '?v=' + Date.now();
  loadScript('config.js' + v, function () {
    // Pages では同じ場所に、ローカル確認ではリポジトリの src/ にある
    loadScript('Program.gs' + v, function (ok) {
      if (ok) return start();
      loadScript('../src/Program.gs' + v, function (ok2) {
        if (!ok2) { document.getElementById('app').innerHTML = '<div class="loading">Program.gs が よみこめませんでした</div>'; return; }
        start();
      });
    });
  });
}
</script>
